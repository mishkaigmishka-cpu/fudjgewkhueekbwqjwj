<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>RANDEVU</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
  <header><div class="logo">⚡ RANDEVU</div><div class="stars" id="balance">⭐ 0</div></header>
  <div class="balance-block"><span>💰 Баланс</span><span id="balanceValue">0</span></div>
  <div class="carousel-wrapper">
    <button class="carousel-btn left" onclick="moveCarousel(-1)">‹</button>
    <div class="carousel-container" id="carousel">
      <div class="case-card" onclick="openCase('free')"><div class="icon">🎁</div><div>Бесплатный</div><div>0⭐</div></div>
      <div class="case-card" onclick="openCase('wood')"><div class="icon">🪵</div><div>Деревянный</div><div>30⭐</div></div>
      <div class="case-card" onclick="openCase('silver')"><div class="icon">⭐</div><div>Серебряный</div><div>50⭐</div></div>
      <div class="case-card" onclick="openCase('gold')"><div class="icon">👑</div><div>Золотой</div><div>200⭐</div></div>
      <div class="case-card" onclick="openCase('diamond')"><div class="icon">💎</div><div>Алмазный</div><div>500⭐</div></div>
      <div class="case-card" onclick="openCase('netherite')"><div class="icon">💥</div><div>Незеритовый</div><div>2000⭐</div></div>
    </div>
    <button class="carousel-btn right" onclick="moveCarousel(1)">›</button>
  </div>
  <div id="result">
    <div id="prizeDisplay"></div>
    <div id="prizeName"></div>
    <div id="prizeValue"></div>
    <div id="adBlock" style="display:none;margin-top:10px;color:#aaa;">📢 <span id="adText"></span></div>
    <div class="result-buttons">
      <button onclick="closeResult()">🔙 Закрыть</button>
      <button id="againBtn" onclick="openAgain()" style="display:none;">🎲 Открыть ещё</button>
    </div>
  </div>
  <nav><span onclick="navigate('home')">🏠 Главная</span><span onclick="navigate('profile')">👤 Профиль</span></nav>
  <div id="profileSection" style="display:none;margin-top:20px;">
    <p>👤 Статус: <span id="profileStatus">Новичок</span></p>
    <p>📦 Кейсов: <span id="profileCases">0</span></p>
    <p>👥 Приглашено: <span id="profileRefs">0</span></p>
    <p>⭐ Баланс: <span id="profileBalance">0</span></p>
    <button onclick="showInvite()">📨 Пригласить</button>
    <button onclick="showTopup()">💳 Пополнить</button>
    <button onclick="showWithdraw()">💸 Вывод</button>
    <button onclick="navigate('home')" style="margin-top:10px;">🔙 Назад</button>
  </div>
  <div id="inviteSection" style="display:none;margin-top:20px;">
    <p>👥 Твоя реферальная ссылка:</p>
    <input id="inviteLink" style="width:100%;padding:8px;border-radius:8px;border:none;">
    <button onclick="copyInvite()">📋 Скопировать</button>
    <button onclick="navigate('profile')" style="margin-top:10px;">🔙 Назад</button>
  </div>
  <div id="topupSection" style="display:none;margin-top:20px;">
    <p>💳 Пополнение (Telegram Stars)</p>
    <div>
      <button onclick="buyStars(100)">100⭐</button>
      <button onclick="buyStars(200)">200⭐</button>
      <button onclick="buyStars(300)">300⭐</button>
      <button onclick="buyStars(400)">400⭐</button>
      <button onclick="buyStars(500)">500⭐</button>
    </div>
    <button onclick="navigate('profile')" style="margin-top:10px;">🔙 Назад</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
